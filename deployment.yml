# ============================================
# NAMESPACE TANIMI
# ============================================
# Kubernetes API versiyonu
apiVersion: v1
# Kaynak türü: Namespace (Ad Alanı)
kind: Namespace
# Namespace metaverileri
metadata:
  # Namespace adı
  name: azatdevopsv1
  # Namespace etiketleri
  labels:
    name: azatdevopsv1
    environment: development

---

# ============================================
# NGINX POD TANIMI
# ============================================
# Kubernetes API versiyonu
apiVersion: v1
# Kaynak türü: Pod
kind: Pod
# Pod metaverileri
metadata:
  # Pod adı
  name: nginx-pod
  # Pod'un dağıtılacağı ad alanı
  namespace: azatdevopsv1
  # Pod tanımlaması ve seçimi için etiketler
  labels:
    app: nginx
# Pod belirtimi
spec:
  # Konteyner tanımları
  containers:
  # İlk konteyner yapılandırması
  - name: nginx
    # Kullanılacak Docker görüntüsü
    image: nginx:latest
    # Görüntü çekme politikası: varsa yerel görüntüyü kullan, yoksa indir
    imagePullPolicy: IfNotPresent 
    # Açığa çıkarılan portlar
    ports:
    # HTTP trafiği için 80 portu
    - containerPort: 80
      # Protokol türü
      protocol: TCP

---

# ============================================
# NGINX DEPLOYMENT TANIMI
# ============================================
# Kubernetes API versiyonu
apiVersion: apps/v1
# Kaynak türü: Deployment (Dağıtım)
kind: Deployment
# Deployment metaverileri
metadata:
  # Deployment adı
  name: nginx-deployment
  # Deployment'ın dağıtılacağı ad alanı
  namespace: azatdevopsv1
# Deployment belirtimi
spec:
  # Pod seçici: hangi pod'ların bu deployment'a ait olduğunu belirler
  selector:
    matchLabels:
      app: nginx
  # Çalışacak pod kopyası sayısı
  replicas: 2
  # Pod şablonu: oluşturulacak pod'ların yapılandırması
  template:
    # Pod metaverileri
    metadata:
      # Pod etiketleri
      labels:
        app: nginx
    # Pod belirtimi
    spec:
      # Konteyner tanımları
      containers:
      # Nginx konteyneri
      - name: nginx
        # Kullanılacak Docker görüntüsü ve versiyonu
        image: nginx:1.16.1
        # Açığa çıkarılan portlar
        ports:
        # HTTP trafiği için 80 portu
        - containerPort: 80

---

# ============================================
# NGINX SERVICE TANIMI (NodePort)
# ============================================
# Kubernetes API versiyonu
apiVersion: v1
# Kaynak türü: Service
kind: Service
# Service metaverileri
metadata:
  # Service adı
  name: nginx-service
  # Service'in dağıtılacağı ad alanı
  namespace: azatdevopsv1
  # Service etiketleri
  labels:
    app: nginx
# Service belirtimi
spec:
  # Service tipi: NodePort (cluster dışından erişim için)
  type: NodePort
  # Hangi pod'lara trafik yönlendirileceğini belirleyen seçici
  selector:
    app: nginx
  # Port tanımları
  ports:
  # HTTP port yapılandırması
  - name: http
    # Service'in dinleyeceği port (cluster içi)
    port: 80
    # Pod'un containerPort'u (hedef port)
    targetPort: 80
    # Node üzerinde açılacak port (30000-32767 arası, belirtilmezse otomatik)
    # nodePort: 30080  # İsteğe bağlı: belirli bir port kullanmak için yorum satırını kaldırın
    # Protokol türü
    protocol: TCP

