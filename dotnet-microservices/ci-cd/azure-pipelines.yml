trigger:
  branches:
    include:
      - main
      - develop
      - release/*

variables:
  buildConfiguration: 'Release'
  dockerRegistryServiceConnection: 'acr-service-connection'
  imageRepository: 'order-service'
  containerRegistry: 'myregistry.azurecr.io'
  dockerfilePath: '**/Order.Api/Dockerfile'
  tag: '$(Build.BuildId)'

stages:
  - stage: Build
    displayName: 'Build ve Test'
    jobs:
      - job: BuildTest
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseDotNet@2
            inputs:
              packageType: 'sdk'
              version: '8.0.x'

          - script: dotnet restore
            displayName: 'Restore'

          - script: dotnet build --configuration $(buildConfiguration) --no-restore
            displayName: 'Build'

          - script: dotnet test --configuration $(buildConfiguration) --no-build --collect:"XPlat Code Coverage" --logger trx
            displayName: 'Unit Tests'

          - task: PublishTestResults@2
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '**/*.trx'

          - task: SonarCloudPrepare@1
            inputs:
              SonarCloud: 'SonarCloud-ServiceConnection'
              organization: 'my-org'
              scannerMode: 'MSBuild'
              projectKey: 'order-service'

          - task: SonarCloudAnalyze@1

          - task: SonarCloudPublish@1
            inputs:
              pollingTimeoutSec: '300'

          - script: dotnet list package --vulnerable --include-transitive
            displayName: 'Dependency Vulnerability Scan (SCA)'

  - stage: DockerBuild
    displayName: 'Docker Build ve Push'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: BuildPush
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: 'Build image'
            inputs:
              command: build
              repository: '$(imageRepository)'
              dockerfile: '$(dockerfilePath)'
              tags: |
                $(tag)
                latest

          - script: |
              docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
                aquasec/trivy image --exit-code 1 --severity CRITICAL,HIGH \
                $(imageRepository):$(tag)
            displayName: 'Container Image Scan (Trivy)'

          - task: Docker@2
            displayName: 'Push image to ACR'
            inputs:
              command: push
              containerRegistry: '$(dockerRegistryServiceConnection)'
              repository: '$(imageRepository)'
              tags: |
                $(tag)
                latest

  - stage: DeployDev
    displayName: 'Deploy to Dev'
    dependsOn: DockerBuild
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    jobs:
      - deployment: DeployDev
        environment: 'dev'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: KubernetesManifest@1
                  inputs:
                    action: 'deploy'
                    kubernetesServiceConnection: 'aks-dev-connection'
                    namespace: 'dev'
                    manifests: |
                      deploy/k8s-base/*.yaml
                    containers: '$(containerRegistry)/$(imageRepository):$(tag)'

  - stage: DeployProd
    displayName: 'Deploy to Production (Manual Approval + Canary)'
    dependsOn: DockerBuild
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployProd
        environment: 'production'   # environment üzerinde onaylayıcılar (approvers) tanımlanır
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          canary:
            increments: [20, 50, 100]
            deploy:
              steps:
                - task: KubernetesManifest@1
                  inputs:
                    action: 'deploy'
                    kubernetesServiceConnection: 'aks-prod-connection'
                    namespace: 'prod'
                    manifests: |
                      deploy/k8s-base/*.yaml
                    containers: '$(containerRegistry)/$(imageRepository):$(tag)'
