# ============================================
# NGINX SERVICE TANIMI (NodePort)
# ============================================
# Kubernetes API versiyonu
apiVersion: v1
# Kaynak türü: Service
kind: Service
# Service metaverileri
metadata:
  # Service adı
  name: nginx-ingerss-service
  # Service'in dağıtılacağı ad alanı
  namespace: azatdevops
  # Service etiketleri
  labels:
    app: nginx
# Service belirtimi
spec:
  # Service tipi: NodePort (cluster dışından erişim için)
  type: NodePort
  # Hangi pod'lara trafik yönlendirileceğini belirleyen seçici
  selector:
    app: nginx
  # Port tanımları
  ports:
  # HTTP port yapılandırması
  - name: http
    # Service'in dinleyeceği port (cluster içi)
    port: 80
    # Pod'un containerPort'u (hedef port)
    targetPort: 80
    # Node üzerinde açılacak port (30000-32767 arası, belirtilmezse otomatik)
    # nodePort: 30080  # İsteğe bağlı: belirli bir port kullanmak için yorum satırını kaldırın
    # Protokol türü
    protocol: TCP

---

# ============================================
# NGINX INGRESS TANIMI
# ============================================
# Kubernetes API versiyonu (Ingress için)
apiVersion: networking.k8s.io/v1
# Kaynak türü: Ingress
kind: Ingress
# Ingress metaverileri
metadata:
  # Ingress adı
  name: nginx-ingress
  # Ingress'in dağıtılacağı ad alanı
  namespace: azatdevops
  # Ingress etiketleri
  labels:
    app: nginx
  # Ingress için özel açıklamalar (annotations)
  annotations:
    # Kullanılacak Ingress Controller sınıfı
    kubernetes.io/ingress.class: "nginx"
    # URL yeniden yazma kuralı (path prefix kaldırma)
    nginx.ingress.kubernetes.io/rewrite-target: /
    # SSL yönlendirmesi (isteğe bağlı)
    # nginx.ingress.kubernetes.io/ssl-redirect: "false"
# Ingress belirtimi
spec:
  # Ingress kuralları
  rules:
  # HTTP trafiği için kural
  - host: nginx.local
    http:
      # Path tabanlı yönlendirme kuralları
      paths:
      # Ana path
      - path: /
        # Path tipi: Prefix (belirtilen path ile başlayan tüm yollar)
        pathType: Prefix
        # Backend service yapılandırması
        backend:
          # Hedef service
          service:
            # Service adı
            name: nginx-ingerss-service
            # Service port
            port:
              # Port numarası
              number: 80
  # İsteğe bağlı: Farklı host için başka bir kural
  # - host: www.nginx.local
  #   http:
  #     paths:
  #     - path: /
  #       pathType: Prefix
  #       backend:
  #         service:
  #           name: nginx-ingerss-service
  #           port:
  #             number: 80
  
  # İsteğe bağlı: TLS/SSL yapılandırması
  # tls:
  # - hosts:
  #   - nginx.local
  #   # Secret adı (TLS sertifikası için)
  #   secretName: nginx-tls-secret