# ============================================
# NAMESPACE
# ============================================
apiVersion: v1
kind: Namespace
metadata:
  name: azatdevops
  labels:
    name: azatdevops

---

# ============================================
# FRONTEND DEPLOYMENT (React/Angular/Vue)
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: azatdevops
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: nginx:alpine
        ports:
        - containerPort: 80
        # Frontend için özel index.html
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo '<h1>FRONTEND</h1><p>Frontend Service - Pod: '$(hostname)'</p>' > /usr/share/nginx/html/index.html
            nginx -g 'daemon off;'

---

# ============================================
# BACKEND API DEPLOYMENT (Node.js/Python/Java)
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: azatdevops
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: nginx:alpine
        ports:
        - containerPort: 80
        # Backend için özel index.html
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo '<h1>BACKEND API</h1><p>API Service - Pod: '$(hostname)'</p>' > /usr/share/nginx/html/index.html
            nginx -g 'daemon off;'

---

# ============================================
# ADMIN PANEL DEPLOYMENT
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-deployment
  namespace: azatdevops
  labels:
    app: admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      containers:
      - name: admin
        image: nginx:alpine
        ports:
        - containerPort: 80
        # Admin için özel index.html
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo '<h1>ADMIN PANEL</h1><p>Admin Dashboard - Pod: '$(hostname)'</p>' > /usr/share/nginx/html/index.html
            nginx -g 'daemon off;'

---

# ============================================
# FRONTEND SERVICE
# ============================================
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: azatdevops
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP

---

# ============================================
# BACKEND SERVICE
# ============================================
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: azatdevops
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP

---

# ============================================
# ADMIN SERVICE
# ============================================
apiVersion: v1
kind: Service
metadata:
  name: admin-service
  namespace: azatdevops
  labels:
    app: admin
spec:
  type: ClusterIP
  selector:
    app: admin
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP

---

# ============================================
# MULTI-SERVICE INGRESS (PATH-BASED ROUTING)
# ============================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: multi-service-ingress
  namespace: azatdevops
  labels:
    app: multi-service
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # Path prefix'i kaldırmadan backend'e gönder
    # nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # CORS ayarları (tüm servisler için)
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  rules:
  # PATH-BASED ROUTING: Tek domain, farklı path'ler
  - host: myapp.local
    http:
      paths:
      # Frontend: http://myapp.local/ veya http://myapp.local/frontend
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
      
      # Backend API: http://myapp.local/api
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 80
      
      # Admin Panel: http://myapp.local/admin
      - path: /admin
        pathType: Prefix
        backend:
          service:
            name: admin-service
            port:
              number: 80

---

# ============================================
# HOST-BASED ROUTING INGRESS (Farklı Domain'ler)
# ============================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: host-based-ingress
  namespace: azatdevops
  labels:
    app: host-based
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  # Frontend: http://frontend.local
  - host: frontend.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
  
  # Backend API: http://api.local
  - host: api.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 80
  
  # Admin Panel: http://admin.local
  - host: admin.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: admin-service
            port:
              number: 80

# ============================================
# KULLANIM TALIMATLARI
# ============================================
# 
# 1. Ingress Controller'ı Etkinleştir:
#    minikube addons enable ingress
#
# 2. Deploy Et:
#    kubectl apply -f multi-service-ingress.yml
#
# 3. Pod'ları Kontrol Et:
#    kubectl get pods -n azatdevops -o wide
#
# 4. Servisleri Kontrol Et:
#    kubectl get svc -n azatdevops
#
# 5. Ingress'leri Kontrol Et:
#    kubectl get ingress -n azatdevops
#
# 6. Hosts Dosyasına Ekle (Windows: C:\Windows\System32\drivers\etc\hosts):
#    <MINIKUBE_IP>  myapp.local
#    <MINIKUBE_IP>  frontend.local
#    <MINIKUBE_IP>  api.local
#    <MINIKUBE_IP>  admin.local
#
# 7. Tarayıcıda Test Et:
#    PATH-BASED:
#    - http://myapp.local/         → Frontend (2 pod arasında load balanced)
#    - http://myapp.local/api      → Backend API (3 pod arasında load balanced)
#    - http://myapp.local/admin    → Admin Panel (1 pod)
#
#    HOST-BASED:
#    - http://frontend.local/      → Frontend
#    - http://api.local/           → Backend API
#    - http://admin.local/         → Admin Panel
#
# 8. Curl ile Test (hosts olmadan):
#    curl -H "Host: myapp.local" http://$(minikube ip)/
#    curl -H "Host: myapp.local" http://$(minikube ip)/api
#    curl -H "Host: myapp.local" http://$(minikube ip)/admin
#
# 9. Load Balancing Test:
#    for ($i=1; $i -le 10; $i++) { 
#      curl -H "Host: myapp.local" http://$(minikube ip)/api 
#    }
#
# 10. Temizle:
#    kubectl delete -f multi-service-ingress.yml
#
